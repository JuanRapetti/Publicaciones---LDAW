<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestor de Publicaciones</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <h1>Gestor de Publicaciones de la Comunidad</h1>

    <section id="panel-estado">
      <h2>Estado de la Comunidad</h2>
      <button type="button" id="consultar">Consultar estado</button>
      <button type="button" id="consultar-inactivas">
        Consultar inactivas
      </button>
      <p id="parrafo-estado"></p>
    </section>

    <!-- Panel de control asíncrono y mensajes de estado -->
    <section id="panel-control">
      <button type="button" id="boton-actualizar">Actualizar</button>
      <button type="button" id="boton-forzar-error">Forzar error</button>
      <p id="estado"></p>
    </section>

    <form id="form-publicacion" action="/publicaciones" method="post">
      <div>
        <input 
          id="titulo" 
          name="titulo" 
          placeholder="Título" 
          minlength="5" 
          maxlength="80" 
          required 
        />
        <small id="error-titulo" class="mensaje-error"></small>
      </div>

      <div>
        <textarea
          id="descripcion"
          name="descripcion"
          placeholder="Descripción"
          minlength="20"
          maxlength="500"
          required
        ></textarea>
      </div>

      <div>
        <input
          id="autor"
          name="autor"
          placeholder="Nombre del autor"
          required
        />
        <small id="error-autor" class="mensaje-error"></small>
      </div>

      <div>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="Email"
          required
        />
        <small id="ayuda-email"></small>
      </div>

      <!-- Campo Categoría (Exigido en Clase 16) -->
      <div>
        <select id="categoria" name="categoria" required>
          <option value="general">General</option>
          <option value="aviso">Aviso</option>
          <option value="evento">Evento</option>
          <option value="compraventa">Compra-venta</option>
        </select>
      </div>

      <div>
        <select id="tipo" name="tipo">
          <option value="venta">Venta</option>
          <option value="servicio">Servicio</option>
        </select>
      </div>

      <div id="campos-especificos"></div>

      <button type="submit" id="boton-publicar" disabled>Publicar</button>
    </form>

    <h3>Vista Previa</h3>
    <output id="vista-previa"></output>

    <h3>Publicaciones</h3>
    <section id="lista-publicaciones"></section>

    <script type="module" src="/js/App.js"></script>
  </body>
</html>
