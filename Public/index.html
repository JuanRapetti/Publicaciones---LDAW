<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gestor de Publicaciones</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <h1>Gestor de Publicaciones de la Comunidad</h1>

    <section id="panel-estado">
      <h2>Estado de la Comunidad</h2>
      <button type="button" id="consultar">Consultar estado</button>
      <button type="button" id="consultar-inactivas">
        Consultar inactivas
      </button>
      <p id="parrafo-estado"></p>
    </section>

    <!-- Panel de control asíncrono y mensajes de estado -->
    <section id="panel-control">
      <button type="button" id="boton-actualizar">Actualizar</button>
      <button type="button" id="boton-forzar-error">Forzar error</button>
      <p id="estado"></p>
    </section>
        <h2>Nueva publicación (envío al servidor)</h2>
    <form id="pedido" action="/publicaciones" method="post">
      <label>Autor <input name="autor" required /></label>
      <label>Título
        <input name="titulo" minlength="5" maxlength="80" required />
      </label>
      <label>Descripcion
        <textarea name="descripcion" minlength="20" maxlength="500" required></textarea>
      </label>
      <label>Categoría
        <select name="categoria" required>
          <option value="general">General</option>
          <option value="aviso">Aviso</option>
          <option value="evento">Evento</option>
          <option value="compraventa">Compra-venta</option>
        </select>
      </label>
      <button>Publicar</button>
    </form>
    <p id="salida"></p>

    <h3>Vista Previa</h3>
    <output id="vista-previa"></output>

    <h3>Publicaciones</h3>
    <section id="lista-publicaciones"></section>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
